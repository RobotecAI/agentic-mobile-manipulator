[tool.poetry]
package-mode = false

[project]
name = "monitoring"
version = "0.1.0"
description = "Profiling RAI/LLM/ROS stack"
authors = [
    {name = "jmatejcz",email = "jakub.matejczyk@robotec.ai"}
]
readme = "README.md"
requires-python = ">=3.10,<3.13"
dependencies = [
    "ollama (>=0.5.1,<0.6.0)",
    "psutil (>=7.0.0,<8.0.0)",
    "langchain-core (>=0.3.69,<0.4.0)",
    "rai-core (>=2.0.3,<3.0.0)"
]



[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
