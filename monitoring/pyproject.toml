[tool.poetry]
package-mode = false

[project]
name = "monitoring"
version = "0.1.0"
description = "Profiling RAI/LLM/ROS stack"
authors = [
    {name = "jmatejcz",email = "jakub.matejczyk@robotec.ai"}
]
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "ollama (>=0.6.3,<0.7.0)",
    "psutil (>=7.2.2,<8.0.0)",
    "numpy (>=1.26,<2.0)",
    "pillow (>=13.0.0,<14.0.0)",
    "langchain-core (>=1.7.7,<2.0.0)",
    "langchain-ollama (>=1.1.0,<2.0.0)",
    "rai-core (>=2.14.1,<2.15.0)"
]



[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
