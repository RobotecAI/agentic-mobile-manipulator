services:
  sim:
    image: mmajekrobotecai/mobile-manipulator-demo-o3de:latest
    environment:
      - DISPLAY=${DISPLAY}
      - QT_X11_NO_MITSHM=1
    devices:
      - /dev/kfd:/dev/kfd
      - /dev/dri:/dev/dri
    volumes:
      - /tmp/.X11-unix:/tmp/.X11-unix
      - ${XAUTHORITY:-$HOME/.Xauthority}:/root/.Xauthority
      - ./start_sim.sh:/root/MobileManipulatorDemo/start_sim.sh
    entrypoint: /ros_entrypoint.sh
    command: /root/MobileManipulatorDemo/start_sim.sh
    networks:
      - ros2_bridge

  stack:
    image: mmajekrobotecai/mobile-manipulator-demo-agents:latest
    environment:
      - DISPLAY=${DISPLAY}
      - QT_X11_NO_MITSHM=1
      - OPENAI_API_KEY=${OPENAI_API_KEY}
    devices:
      - /dev/kfd:/dev/kfd
      - /dev/dri:/dev/dri
    volumes:
      - /tmp/.X11-unix:/tmp/.X11-unix
      - ${XAUTHORITY:-$HOME/.Xauthority}:/root/.Xauthority
      - ../scripts/run_ros2_stack.sh:/root/MobileManipulatorDemo/run_ros2_stack.sh
      - ./start_hmi_and_stack.sh:/root/MobileManipulatorDemo/start_hmi_and_stack.sh

    entrypoint: /ros_entrypoint.sh
    command: /root/MobileManipulatorDemo/start_hmi_and_stack.sh
    networks:
      - ros2_bridge

  agents:
    image: mmajekrobotecai/mobile-manipulator-demo-agents:latest
    environment:
      - DISPLAY=${DISPLAY}
      - QT_X11_NO_MITSHM=1
      - OPENAI_API_KEY=${OPENAI_API_KEY}
    devices:
      - /dev/kfd:/dev/kfd
      - /dev/dri:/dev/dri
    volumes:
      - /tmp/.X11-unix:/tmp/.X11-unix
      - ${XAUTHORITY:-$HOME/.Xauthority}:/root/.Xauthority
      - ./start_orchestrator.sh:/root/MobileManipulatorDemo/start_orchestrator.sh

    entrypoint: /ros_entrypoint.sh
    command: /root/MobileManipulatorDemo/start_orchestrator.sh
    networks:
      - ros2_bridge

  safety-embeddings:
    image: mmajekrobotecai/mobile-manipulator-demo-llama:latest
    build:
      dockerfile: Dockerfile.llama
    command: -m /custom_ggufs/Qwen3-Embedding-0.6b_BF16.gguf --embedding -c 4096 -b 2048 -ub 2048 --pooling last --port 8082 --host 0.0.0.0
    networks:
      - ros2_bridge

  safety-reranker:
    image: mmajekrobotecai/mobile-manipulator-demo-llama:latest
    build:
      dockerfile: Dockerfile.llama
    command: -m /custom_ggufs/Qwen3-Reranker-0.6B_16BF.gguf --embedding --pooling rank -fa on -c 4096 -b 2048 -ub 2048 --port 8083 --host 0.0.0.0
    networks:
      - ros2_bridge
networks:
  ros2_bridge:
    driver: bridge
