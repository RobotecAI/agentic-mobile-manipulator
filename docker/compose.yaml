# Dockerised single-PC demo. The image is built in three cacheable layers, each a
# separately-taggable service so the heavy, rarely-changing bases (ROS 2 workspace,
# O3DE SDK + sim) can be pushed/pulled and reused:
#
#   ros2  →  o3de  →  demo
#
# Only `demo` is run. It is the whole single-pc stack in one container; its
# entrypoint, `pixi run demo`, launches sim → stack → inference → agents → hmi
# each in its own tmux session — identical to running the demo natively.
#
# Build everything:   docker compose -f docker/compose.yaml build
# Run the demo:        xhost +local:root && docker compose -f docker/compose.yaml run --rm demo
#
# Target is single-pc-gpu-and-npu (the default). For a GPU-only image — llama.cpp
# (Vulkan) only, no FastFlowLM/NPU — build with:
#   WITH_NPU=0 docker compose -f docker/compose.yaml build
# A GPU-only image additionally needs, at run time: drop the /dev/accel device and
# the memlock ulimit below, and supply a config.toml whose vlm_safety endpoint is
# on a gpu backend (not npu) — otherwise `pixi run inference` aborts on the missing
# NPU engine.
#
# Prerequisites on the host (an AMD Ryzen AI box):
#   - GPU + NPU exposed via the devices below (amdxdna kernel driver loaded on host)
#   - model weights present in ../models (pixi run download-models), bind-mounted in

services:
  # ── Base: RoboStack ROS 2 + built workspace ────────────────────────────────
  ros2:
    image: robotecai/mobile-manipulator-demo-ros2:latest
    build:
      context: ..
      dockerfile: docker/Dockerfile.ros2

  # ── Base: + O3DE SDK and built simulation ──────────────────────────────────
  o3de:
    image: robotecai/mobile-manipulator-demo-o3de:latest
    build:
      context: ..
      dockerfile: docker/Dockerfile.o3de
      additional_contexts:
        base_image: service:ros2

  # ── The demo: + agents, local inference engines; runs the whole stack ───────
  demo:
    image: robotecai/mobile-manipulator-demo:latest
    build:
      context: ..
      dockerfile: docker/Dockerfile.demo
      additional_contexts:
        base_image: service:o3de
      args:
        # 1 = gpu-and-npu (default); 0 = gpu-only. `WITH_NPU=0 docker compose build`.
        WITH_NPU: ${WITH_NPU:-1}
    entrypoint: ["pixi", "run", "demo"]
    environment:
      - DISPLAY=${DISPLAY}
      - QT_X11_NO_MITSHM=1
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - ROS_DOMAIN_ID=${ROS_DOMAIN_ID:-42}
      # Hold demo.sh open as PID 1 so the detached tmux sessions outlive its launch.
      - AMM_KEEP_ALIVE=1
      # Keep NPU (FastFlowLM) weights inside the mounted models/ dir instead of
      # flm's default ~/.config/flm, so they persist via the bind mount.
      - FLM_MODEL_PATH=/root/MobileManipulatorDemo/models/flm
    devices:
      - /dev/kfd:/dev/kfd            # AMD GPU compute (ROCm)
      - /dev/dri:/dev/dri            # AMD GPU render (Vulkan)
      - /dev/accel/accel0:/dev/accel/accel0  # Ryzen AI NPU (amdxdna)
    # The NPU pins memory; without unlimited memlock FastFlowLM fails to allocate.
    ulimits:
      memlock:
        soft: -1
        hard: -1
    volumes:
      - /tmp/.X11-unix:/tmp/.X11-unix
      - ${XAUTHORITY:-$HOME/.Xauthority}:/root/.Xauthority
      - ../config.toml:/root/MobileManipulatorDemo/config.toml
      # All weights live under the repo's models/: llama ggufs in models/, NPU
      # models in models/flm (FLM_MODEL_PATH below). `pixi run download-models`
      # fetches both. No host-home (~/.config/flm) coupling.
      - ../models:/root/MobileManipulatorDemo/models
    # Single host: ROS 2 DDS + every inference endpoint talk over localhost, and
    # host networking lets RViz/ros2 on the host introspect the running demo.
    network_mode: host
