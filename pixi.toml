[workspace]
name = "agentic-mobile-manipulator"
version = "1.0.0"
description = "Agentic Mobile Manipulator Demo"
channels = ["robostack-jazzy", "conda-forge"]
platforms = ["linux-64"]

# ─── Activation ─────────────────────────────────────────────────────────────────
# scripts/setup_env.sh sources the ros2_ws overlay when available.
[activation]
env = {DEMO_ROOT = "${PIXI_PROJECT_ROOT}"}
scripts = ["scripts/setup_env.sh"]

[dependencies]
# ─── ROS 2 Jazzy (RoboStack) ─────────────────────────────────────────────────
# The full ROS 2 runtime comes from the robostack-jazzy conda channel.
# pixi runs RoboStack's activation scripts automatically, so AMENT_PREFIX_PATH,
# PYTHONPATH, etc. are set up on `pixi shell` / `pixi run`.
#
# NOTE: nav2-bringup is deliberately omitted — it transitively pulls
# ros-gz-sim → simulation_interfaces 1.2.0, which clashes with the source-built
# 1.5.1 overlay required by the O3DE SimulationInterfaces gem.
ros-jazzy-desktop = "*"
ros-jazzy-navigation2 = "*"
ros-jazzy-interactive-marker-twist-server = "*"
ros-jazzy-vision-msgs = "*"
ros-jazzy-moveit = "2.12.*"
ros-jazzy-moveit-py = "2.12.*"
ros-jazzy-tf-transformations = "*"
ros-jazzy-ros2-control = "*"
ros-jazzy-ros2-controllers = "*"

# Previously vcs-imported and colcon-built; now binary conda packages.
# (See ros2_ws.repos for the full migration note.)
ros-jazzy-ur-description = "*"
ros-jazzy-control-msgs = "*"
ros-jazzy-control-toolbox = "*"
ros-jazzy-kinematics-interface = "*"
ros-jazzy-moveit-msgs = "*"
ros-jazzy-realtime-tools = "*"
ros-jazzy-srdfdom = "*"

# ─── Build toolchain (for source packages remaining in ros2_ws/src) ──────────
# Use conda compilers so source packages stay ABI-compatible with the RoboStack
# binaries they link against. O3DE is built outside this env (system toolchain).
colcon-common-extensions = "*"
vcstool = "*"
c-compiler = "*"
cxx-compiler = "*"
pkg-config = "*"
qt-main = "*"
nlohmann_json = "*"

# ─── Workspace tasks ────────────────────────────────────────────────────────────

[tasks.check-env]
cmd = "bash scripts/check_env.sh"
description = "Fail fast if apt ROS 2 (/opt/ros) is sourced — must not be mixed with conda/RoboStack"

[tasks.smoke-test]
cmd = "bash scripts/smoke_test.sh"
description = "Check if all LLM inference servers are up"

# ─── Feature: ros2 ──────────────────────────────────────────────────────────────

[feature.ros2.tasks.clone-ros2-ws]
cmd = "vcs import --input ros2_ws.repos"
outputs = ["ros2_ws/src/packages/rai_interfaces"]
description = "Clone ROS 2 workspace repositories"

[feature.ros2.tasks.build-ros2]
cmd = "colcon build --cmake-args -DCMAKE_BUILD_TYPE=Release"
cwd = "ros2_ws"
outputs = ["ros2_ws/install/"]
description = "Build the ROS 2 workspace with colcon (deps provided by conda/RoboStack — no rosdep)"

[feature.ros2.tasks.ros2]
cmd = "bash scripts/run_ros2_stack.sh"
description = "Launch full ROS 2 stack (robot, nav2, moveit2, scene, agents)"

[feature.ros2.tasks.hmi]
cmd = "ros2 launch mobile_manipulator_hmi hmi_launch.py"
description = "Launch the Human-Machine Interface"

[feature.ros2.tasks.orchestrator]
cmd = "uv run python rai_app/agents/agent_orchestrator.py"
description = "Launch the agent orchestrator"

# Individual agents — use these instead of ros2 when debugging a specific component.

[feature.ros2.tasks.nav2-agent]
cmd = "uv run python rai_app/agents/nav2_agent.py"
description = "Launch nav2 agent"

[feature.ros2.tasks.moveit2-agent]
cmd = "uv run python rai_app/agents/moveit2_agent.py"
description = "Launch moveit2 agent"

[feature.ros2.tasks.scene-agent]
cmd = "uv run python rai_app/environment/scene_agent.py"
description = "Launch scene agent"

[feature.ros2.tasks.inspection-agent]
cmd = "uv run python rai_app/agents/inspection_agent.py"
description = "Launch inspection agent"

[feature.ros2.tasks.safety-agent]
cmd = "bash scripts/start_safety_agent.sh"
description = "Launch safety agent (with RAG)"

# ─── Feature: sim ───────────────────────────────────────────────────────────────

[feature.sim.tasks.install-o3de]
cmd = "scripts/install_o3de.sh"
outputs = ["/opt/O3DE/26.05/scripts/o3de.sh"]
description = "Install the O3DE engine SDK"

[feature.sim.tasks.clone-gems]
cmd = "vcs import --input gems.repos && git lfs install && (cd gems && vcs custom --git --args 'lfs pull')"
outputs = ["gems/robotec-warehouse-assets"]
description = "Clone local O3DE gems and fetch LFS assets"

[feature.sim.tasks.fetch-gems]
cmd = "scripts/fetch_gems.sh"
outputs = ["external/o3de-extras"]
description = "Clone o3de-extras gems locally and validate all gem paths from project.json"

[feature.sim.tasks.build-sim]
cmd = """
cmake -B build/linux -G "Ninja Multi-Config" \
    -DCMAKE_MODULE_PATH=$O3DE_ENGINE_PATH/cmake \
    -DLY_DISABLE_TEST_MODULES=ON \
    -DCMAKE_EXPORT_COMPILE_COMMANDS=ON \
    -DLY_STRIP_DEBUG_SYMBOLS=ON &&
cmake --build build/linux --config profile \
    --target MobileManipulatorDemo.Assets MobileManipulatorDemo.GameLauncher
"""
cwd = "sim"
outputs = ["sim/build/linux/bin/profile/MobileManipulatorDemo.GameLauncher"]
description = "Build O3DE GameLauncher and project assets"

[feature.sim.tasks.sim]
cmd = "$DEMO_ROOT/sim/build/linux/bin/profile/MobileManipulatorDemo.GameLauncher -bg_ConnectToAssetProcessor=0"
description = "Launch O3DE simulation"

[feature.sim.tasks.editor]
cmd = "$O3DE_ENGINE_PATH/bin/Linux/profile/Default/Editor --project-path $DEMO_ROOT/sim"
description = "Launch O3DE Editor from SDK (project must be built first)"

# ─── Feature: local-inference ───────────────────────────────────────────────────

[feature.local-inference.tasks.clone-inference]
cmd = "vcs import --input inference.repos"
outputs = ["inference/llama.cpp"]
description = "Clone llama.cpp (required for local inference)"

[feature.local-inference.tasks.build-llama]
cmd = """
cmake -B build -DGGML_VULKAN=1 &&
cmake --build build --config Release -j $(nproc)
"""
cwd = "inference/llama.cpp"
outputs = ["inference/llama.cpp/build/bin/llama-server"]
description = "Build llama.cpp with Vulkan backend"

[feature.local-inference.tasks.download-models]
cmd = "bash scripts/download_models.sh"
description = "Download models for local inference"

# Default model paths assume models are placed in $DEMO_ROOT/models/.
# Override by setting the env var before running, e.g.:
#   LLM_MODEL=/path/to/gpt-oss-20b-Q4_K_M.gguf pixi run serve-llm

[feature.local-inference.tasks.serve-llm]
cmd = "$DEMO_ROOT/inference/llama.cpp/build/bin/llama-server -m $LLM_MODEL --no-prefill-assistant --port 8080"
env = { LLM_MODEL = "$DEMO_ROOT/models/gpt-oss-20b-Q4_K_M.gguf" }
description = "Serve GPT-OSS-20B on port 8080 (set LLM_MODEL to override path)"

[feature.local-inference.tasks.serve-vlm]
cmd = "$DEMO_ROOT/inference/llama.cpp/build/bin/llama-server -m $VLM_MODEL --mmproj $VLM_MMPROJ --port 8081"
env = { VLM_MODEL = "$DEMO_ROOT/models/LFM2-VL-3B-Q8_0.gguf", VLM_MMPROJ = "$DEMO_ROOT/models/mmproj-LFM2-VL-3B-Q8_0.gguf" }
description = "Serve LFM2-VL-3B on port 8081 (set VLM_MODEL / VLM_MMPROJ to override paths)"

[feature.local-inference.tasks.serve-embedding]
cmd = "$DEMO_ROOT/inference/llama.cpp/build/bin/llama-server -m $EMBEDDING_MODEL --embedding --pooling last -c 4096 -b 2048 -ub 2048 --port 8082"
env = { EMBEDDING_MODEL = "$DEMO_ROOT/models/Qwen3-Embedding-0.6B-Q8_0.gguf" }
description = "Serve Qwen3-Embedding-0.6b on port 8082"

[feature.local-inference.tasks.serve-reranker]
cmd = "$DEMO_ROOT/inference/llama.cpp/build/bin/llama-server -m $RERANKER_MODEL --embedding --pooling rank -c 4096 -b 2048 -ub 2048 --port 8083"
env = { RERANKER_MODEL = "$DEMO_ROOT/models/qwen3-reranker-0.6b-q8_0.gguf" }
description = "Serve Qwen3-Reranker-0.6B on port 8083"

[feature.local-inference.tasks.serve-all]
cmd = "bash scripts/serve_all.sh"
description = "Launch all inference servers in a tmux session (2x2 grid)"

# ─── Profile features ───────────────────────────────────────────────────────────
# One profile feature per environment. Each defines a `setup` entry point so
# that `pixi run -e <env> setup` builds exactly the components for that machine.

[feature.profile-default.tasks.clone]
depends-on = ["clone-gems", "clone-ros2-ws"]
description = "Clone all repositories (gems and ROS 2 workspace)"

[feature.profile-default.tasks.setup]
depends-on = ["clone", "install-o3de", "fetch-gems", "build-ros2", "build-sim", "sync"]
description = "Full setup (O3DE + ROS 2 + Python)"

[feature.profile-hil.tasks.setup]
depends-on = ["clone-ros2-ws", "build-ros2", "sync"]
description = "Setup HIL machine (ROS 2 + Python, no O3DE)"

[feature.profile-hil-local.tasks.setup]
depends-on = ["clone-ros2-ws", "clone-inference", "build-ros2", "sync", "build-llama"]
description = "Setup HIL machine with local llama.cpp inference"

[feature.profile-local.tasks.clone]
depends-on = ["clone-gems", "clone-ros2-ws"]
description = "Clone all repositories (gems and ROS 2 workspace)"

[feature.profile-local.tasks.setup]
depends-on = ["clone", "install-o3de", "fetch-gems", "build-ros2", "build-sim", "sync", "build-llama"]
description = "Full setup including local llama.cpp inference"

[feature.profile-local.tasks.demo]
cmd = "bash scripts/demo.sh"
description = "Start full demo: sim → ros2 → inference → orchestrator (3 tmux sessions)"

[feature.profile-local.tasks.demo-stop]
cmd = "bash scripts/demo_stop.sh"
description = "Stop all demo tmux sessions"

# ─── Feature: dev ───────────────────────────────────────────────────────────────
# Lightweight feature for Python tooling (uv, pre-commit, pytest).
# Included in every environment so `pixi run sync/lint/test` works everywhere.
# Use `pixi run -e dev <task>` to avoid installing ROS 2 / compiler packages
# when all you need is linting or tests.

[feature.dev.dependencies]
uv = ">=0.5"

[feature.dev.tasks.sync]
cmd = "uv sync"
description = "Install Python dependencies"

[feature.dev.tasks.pre-commit-install]
cmd = "uv run pre-commit install"
depends-on = ["sync"]
description = "Install pre-commit hooks"

[feature.dev.tasks.lint]
cmd = "uv run pre-commit run --all-files"
depends-on = ["sync"]
description = "Run all linters and formatters"

[feature.dev.tasks.test]
cmd = "uv run pytest"
depends-on = ["sync"]
description = "Run test suite"

# ─── Environments ───────────────────────────────────────────────────────────────
# Run `pixi run -e <env> setup` to bootstrap the matching machine type.
# Tasks from features not included in an environment are unavailable in it —
# e.g. `build-sim` cannot be run in the `hil` environment.

[environments]
default   = {features = ["dev", "ros2", "sim", "profile-default"]}
hil       = {features = ["dev", "ros2", "profile-hil"]}
hil-local = {features = ["dev", "ros2", "local-inference", "profile-hil-local"]}
local     = {features = ["dev", "ros2", "sim", "local-inference", "profile-local"]}
dev       = {features = ["dev"], no-default-feature = true}
