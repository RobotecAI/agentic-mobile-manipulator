[project]
name = "golden-hiptage"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "faiss-cpu>=1.12.0",
    "langchain-community>=0.3.21",
    "langfuse[langchain]>=2.60.9",
    "pre-commit>=4.3.0",
    "psutil>=7.1.0",
    "pytest>=8.4.2",
    "rai-core>=2.5.4",
    "scikit-image>=0.25.2",
]
[tool.setuptools.packages.find]
include = ["scripts*", "rai_app*"]

[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"
